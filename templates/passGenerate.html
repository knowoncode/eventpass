<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>EventFestMyPass - Create Pass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; min-height: 100vh; display: flex; flex-direction: column; }
        .pass-card { border-radius: 15px; padding: 20px; color: white; text-align: center; border: 2px dashed rgba(255,255,255,0.5); background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body>
    <!-- Navbar omitted for brevity -->

    <main class="container my-5">
        <h2 class="text-center mb-4">Generate Your Event Pass</h2>
        <div class="row justify-content-center">
            <div class="col-md-5 mb-4">
                <div class="card bg-dark border-secondary shadow p-4">
                    <form id="generatePassForm">
                        <div class="mb-3"><label>Attendee Name</label><input type="text" id="passName" class="form-control" required></div>
                        <div class="mb-4"><label>Email Address</label><input type="email" id="passEmail" class="form-control" required></div>
                        <button type="submit" class="btn btn-success w-100 fw-bold">Generate Pass & QR</button>
                        <a href="dashboard.html" class="btn btn-outline-secondary w-100 mt-2">Back to Dashboard</a>
                    </form>
                </div>
            </div>
            <div class="col-md-5 text-center">
                <div id="generatedPassContainer" class="pass-card shadow" style="display: none;">
                    <h4 class="mb-1 text-uppercase fw-bold">EventFest Entry</h4><hr class="text-white">
                    <h5 id="outName" class="mt-3"></h5>
                    <p id="outEmail" class="small"></p>
                    <div class="d-flex justify-content-center my-3"><div id="qrcode" class="p-2 bg-white rounded"></div></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        document.getElementById('generatePassForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('passName').value;
            const email = document.getElementById('passEmail').value;
            
            document.getElementById('outName').innerText = name;
            document.getElementById('outEmail').innerText = email;
            document.getElementById('qrcode').innerHTML = "";
            
            new QRCode(document.getElementById("qrcode"), {
                text: "Name: " + name + " | Email: " + email,
                width: 128, height: 128
            });
            
            document.getElementById('generatedPassContainer').style.display = 'block';
        });
    </script>
</body>
</html>

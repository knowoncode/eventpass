<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventFestMyPass - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; min-height: 100vh; display: flex; flex-direction: column; }
        main { flex: 1; }
        .anim-hover { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .anim-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,255,255,0.2); }
        .nav-link { transition: color 0.3s ease; }
        .nav-link:hover { color: #0dcaf0 !important; text-shadow: 0 0 8px rgba(13, 202, 240, 0.6); }
        .pass-card { border-radius: 15px; padding: 20px; color: white; text-align: center; border: 2px dashed rgba(255,255,255,0.5); overflow: hidden; }
        .pass-card.color-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .pass-card.color-2 { background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .floating { animation: float 4s ease-in-out infinite; }
        .carousel-item img { height: 400px; object-fit: cover; border-radius: 10px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="/">🎉 EventFestMyPass</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">HOME</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">USER</a>
                        <ul class="dropdown-menu dropdown-menu-dark">
                            <li><a class="dropdown-item" href="/login">Login</a></li>
                            <li><a class="dropdown-item" href="/signUp">Signup</a></li>
                            <!-- <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="dashboard.html">Dashboard</a></li> -->
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">ADMIN</a>
                        <ul class="dropdown-menu dropdown-menu-dark">
                            <li><a class="dropdown-item" href="/adminLogin">Admin Login</a></li>
                            <li><a class="dropdown-item" href="/adminSignUp">Admin Signup</a></li>
                            <!-- <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="dashboard.html">Dashboard</a></li> -->
                        </ul>
                    </li>
                    
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div id="heroCarousel" class="carousel slide anim-hover mb-5 shadow-lg" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?q=80&w=1200&h=400&auto=format&fit=crop" class="d-block w-100" alt="Concert">
                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded"><h5>Massive Concerts</h5></div>
                </div>
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1540039155732-6871482df497?q=80&w=1200&h=400&auto=format&fit=crop" class="d-block w-100" alt="Conference">
                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded"><h5>Exclusive Conferences</h5></div>
                </div>
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=1200&h=400&auto=format&fit=crop" class="d-block w-100" alt="Party">
                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded"><h5>Private Parties</h5></div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>

        <h3 class="text-center mb-4">Sample Passes</h3>
        <div class="row justify-content-center gap-4">
            <div class="col-md-5">
                <div class="pass-card color-1 floating anim-hover shadow">
                    <h4 class="mb-3">VIP Access</h4><p>John Doe</p>
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=SampleVIPPass" class="rounded bg-white p-2">
                </div>
            </div>
            <div class="col-md-5">
                <div class="pass-card color-2 floating anim-hover shadow">
                    <h4 class="mb-3">General Admission</h4><p>Jane Smith</p>
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=SampleGeneralPass" class="rounded bg-white p-2">
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-center py-3 border-top border-secondary mt-auto">
        <p class="mb-0 text-muted">&copy; 2026 Dzinex Technologies. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        window.onload = () => {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        };
    </script>
</body>
</html>

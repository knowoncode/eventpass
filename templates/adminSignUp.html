<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventFestMyPass | Admin Sign Up</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#0891b2);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

body::before{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:#06b6d4;
    border-radius:50%;
    top:-120px;
    left:-120px;
    filter:blur(120px);
    opacity:.5;
}

body::after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:#2563eb;
    border-radius:50%;
    bottom:-120px;
    right:-120px;
    filter:blur(120px);
    opacity:.5;
}

.navbar{
    background:rgba(0,0,0,.35)!important;
    backdrop-filter:blur(10px);
}

main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    z-index:2;
}

.signup-card{

    width:100%;
    max-width:450px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.15);

    backdrop-filter:blur(15px);

    border-radius:20px;

    transition:.3s;
}

.signup-card:hover{
    transform:translateY(-8px);
    box-shadow:0 20px 40px rgba(0,255,255,.2);
}

.logo{

    width:90px;
    height:90px;

    background:linear-gradient(135deg,#06b6d4,#3b82f6);

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:40px;

    color:white;

    margin:auto;
}

.form-control{

    background:#111827;
    color:white;
    border:none;
    padding:12px;
}

.form-control:focus{

    background:#111827;
    color:white;

    border:1px solid #00e5ff;

    box-shadow:0 0 12px #00e5ff;
}

.btn-register{

    background:linear-gradient(90deg,#06b6d4,#3b82f6);

    border:none;

    color:white;

    font-weight:bold;

    transition:.3s;
}

.btn-register:hover{

    transform:scale(1.03);

    box-shadow:0 0 20px cyan;
}

.input-group-text{
    background:#111827;
    color:white;
    border:none;
    cursor:pointer;
}

.footer{
    text-align:center;
    color:#ddd;
    padding:15px;
}

</style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold text-info" href="/">
            🎉 EventFestMyPass
        </a>
    </div>
</nav>

<main>

<div class="signup-card shadow-lg">

<div class="card-body p-5">

<div class="logo mb-4">
<i class="bi bi-person-plus-fill"></i>
</div>

<h2 class="text-center text-white">Admin Registration</h2>

<p class="text-center text-secondary mb-4">
Create an administrator account
</p>

{% with message = get_flashed_messages() %}
{% if message %}
{% for msg in message %}
<div class="alert alert-danger">
{{msg}}
</div>
{% endfor %}
{% endif %}
{% endwith %}

<form action="/adminSignUp" method="POST">

<div class="mb-3">

<label class="form-label">
<i class="bi bi-building text-info"></i>
College Name 
</label>
<input
type="text"
name="college"
class="form-control"
placeholder="Enter College Name"
required> </input>



</div>

<div class="mb-3">

<label class="form-label">
<i class="bi bi-envelope-fill text-info"></i>
Admin Email
</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter Admin Email"
required>

</div>

<div class="mb-4">

<label class="form-label">
<i class="bi bi-lock-fill text-info"></i>
Password
</label>

<div class="input-group">

<input
type="password"
name="password"
id="password"
class="form-control"
placeholder="Create Password"
required>

<span class="input-group-text" onclick="togglePassword()">
<i class="bi bi-eye-fill" id="eye"></i>
</span>

</div>

</div>

<button type="submit" class="btn btn-register w-100 py-2">
<i class="bi bi-person-check-fill"></i>
Create Admin Account
</button>

<div class="text-center mt-4">

Already registered?

<a href="/adminLogin" class="text-info text-decoration-none fw-semibold">
Login Here
</a>

</div>

</form>

</div>

</div>

</main>

<div class="footer">
© 2026 EventFestMyPass | Admin Portal
</div>

<script>
function togglePassword(){

const pass=document.getElementById("password");
const eye=document.getElementById("eye");

if(pass.type==="password"){
pass.type="text";
eye.classList.replace("bi-eye-fill","bi-eye-slash-fill");
}else{
pass.type="password";
eye.classList.replace("bi-eye-slash-fill","bi-eye-fill");
}

}
</script>

</body>
</html>

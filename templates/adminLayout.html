<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventFestMyPass - Admin Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#121212;
            color:white;
        }

        .card{
            background:#1e1e1e;
            
            border:1px solid #444;
        }

        .stat-card{
            text-align:center;
            transition:0.3s;
        }

        .stat-card:hover{
            transform:translateY(-5px);
        }
    </style>
</head>

<body>

<div class="container my-5">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
        <h2>
            Admin
        </h2>

        <div>
            <span class="btn btn-warning">
                <a href="/adminProfile" style="text-decoration: none;">{{session['adminCollege']}}</a>
            </span>

            <a href="/adminLogout" class="btn btn-outline-danger">
                Logout
            </a>
        </div>
    </div>

    <!-- Action Buttons -->

    <div class="card p-4">

        <h4 class="mb-3">Quick Actions</h4>

        <div class="d-flex flex-wrap gap-3">
            <a href="/adminDash" class="btn btn-secondary">
                Dashboard
            </a>

            <a href="/addEvent" class="btn btn-warning">
                Add Event
            </a>

            <a href="/manageEvent" class="btn btn-info">
                Manage Events
            </a>

            <a href="/viewEvent" class="btn btn-success">
                View Users
            </a>

            

        </div>

    </div>
</div>
{% block content %}
{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

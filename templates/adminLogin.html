<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventFestMyPass | Admin Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;
    display:flex;
    flex-direction:column;

    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    overflow-x:hidden;
}

/* Background Glow */

body::before{
    content:'';
    position:absolute;
    width:450px;
    height:450px;
    background:#00e5ff55;
    border-radius:50%;
    top:-120px;
    left:-100px;
    filter:blur(120px);
}

body::after{
    content:'';
    position:absolute;
    width:450px;
    height:450px;
    background:#4d5bf955;
    border-radius:50%;
    bottom:-150px;
    right:-120px;
    filter:blur(120px);
}

main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    z-index:2;
}

/* Navbar */

.navbar{
    backdrop-filter:blur(10px);
    background:rgba(0,0,0,.4)!important;
}

/* Login Card */

.login-card{

    width:100%;
    max-width:430px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.15);

    border-radius:20px;

    transition:.4s;
}

.login-card:hover{

    transform:translateY(-8px);

    box-shadow:0 15px 35px rgba(0,255,255,.25);

}

/* Icon */

.admin-icon{

    width:90px;
    height:90px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:auto;

    background:linear-gradient(135deg,#00e5ff,#00bcd4);

    color:#111;

    font-size:45px;

    box-shadow:0 0 30px rgba(0,255,255,.4);

}

/* Inputs */

.form-control{

    background:#161b22;

    color:white;

    border:none;

    padding:12px;

}

.form-control:focus{

    background:#161b22;

    color:white;

    border:1px solid cyan;

    box-shadow:0 0 12px cyan;

}

/* Button */

.login-btn{

    background:linear-gradient(135deg,#00e5ff,#00bcd4);

    color:black;

    font-weight:bold;

    transition:.35s;

}

.login-btn:hover{

    transform:scale(1.04);

    box-shadow:0 0 18px cyan;

}

/* Footer */

.footer{

    color:#bbb;

    text-align:center;

    padding:15px;

}

.input-group-text{

    cursor:pointer;

    background:#161b22;

    color:white;

    border:none;

}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary">

<div class="container">

<a class="navbar-brand text-info fw-bold" href="/">
🎉 EventFestMyPass
</a>

</div>

</nav>

<main>

<div class="login-card shadow-lg">

<div class="card-body p-5">

<div class="admin-icon mb-4">

<i class="bi bi-shield-lock-fill"></i>

</div>

<h2 class="text-center fw-bold mb-2">
Administrator Login
</h2>

<p class="text-center text-secondary mb-4">
Secure access to EventFest MyPass Dashboard
</p>

<!-- Flash Message -->

{% with message = get_flashed_messages() %}
{% if message %}
{% for msg in message %}

<div class="alert alert-danger">

{{msg}}

</div>

{% endfor %}
{% endif %}
{% endwith %}

<form action="/adminLogin" method="POST">

<div class="mb-3">

<label class="mb-2">

<i class="bi bi-envelope-fill text-info"></i>
Admin Email

</label>

<input
type="email"
class="form-control"
name="email"
placeholder="admin@eventfest.com"
required>

</div>

<div class="mb-4">

<label class="mb-2">

<i class="bi bi-lock-fill text-info"></i>

Password

</label>

<div class="input-group">

<input
type="password"
class="form-control"
id="password"
name="password"
placeholder="Enter Password"
required>

<span class="input-group-text" onclick="togglePassword()">

<i class="bi bi-eye-fill" id="eye"></i>

</span>

</div>

</div>

<button class="btn login-btn w-100 py-2">

<i class="bi bi-box-arrow-in-right"></i>

Login to Dashboard

</button>

</form>
New College?<a href="/adminSignUp" class="text-info text-decoration-none fw-semibold">
    SignUp Here
</a>
</div>

</div>

</main>

<div class="footer">

© 2026 EventFestMyPass | Admin Portal

</div>

<script>

function togglePassword(){

let pass=document.getElementById("password");

let eye=document.getElementById("eye");

if(pass.type==="password"){

pass.type="text";

eye.classList.remove("bi-eye-fill");

eye.classList.add("bi-eye-slash-fill");

}
else{

pass.type="password";

eye.classList.remove("bi-eye-slash-fill");

eye.classList.add("bi-eye-fill");

}

}

</script>

</body>
</html>

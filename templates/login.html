<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>EventFestMyPass - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #121212; min-height: 100vh; display: flex; flex-direction: column; }</style>
</head>
<body>
    <!-- Navbar omitted for brevity, paste same as index.html -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card bg-dark border-secondary shadow p-4">
                    {% with message = get_flashed_messages() %}
                    {% if message %}
                    {% for msg in message %}
                        <div class="alert alert-danger" role="alert">
                            {{msg}}
                        </div>
                    {% endfor %}
                    {% endif %}
                    {% endwith %}
                    <h3 class="text-center mb-4">User Login</h3>
                    <form action="/login" method="post">
                        <div class="mb-3"><label>Email address</label><input name="email" type="email" class="form-control"></div>
                        <div class="mb-4"><label>Password</label><input name="password" type="password" class="form-control"></div>
                        <button type="submit" class="btn btn-info w-100 text-dark">Login</button>
                        <div class="text-center mt-3">New user? <a href="/signUp" class="text-info">Create an account</a></div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>

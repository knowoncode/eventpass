<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>EventFestMyPass - Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; min-height: 100vh; display: flex; flex-direction: column; }
        main { flex: 1; }
        .anim-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,255,255,0.2); }
        .btn-anim:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <!-- INCLUDE THE SAME NAVBAR HERE -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top">
        <div class="container">
            <a class="navbar-brand text-info" href="index.html">🎉 EventFestMyPass</a>
            <!-- Keep rest of navbar identical to index.html -->
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card bg-dark border-secondary anim-hover shadow">
                    <div class="card-body p-4">
                        {% with message = get_flashed_messages() %}
                        {% if message %}
                        {% for msg in message %}
                        <div class="alert alert-danger" role="alert">
                            {{msg}}
                        </div>
                        {% endfor %}
                        {% endif %}
                        {% endwith %}
                        <h3 class="text-center mb-4">Create Account</h3>
                        <form action="/signUp" method="post">
                            <div class="row">
                                <div class="col-md-6 mb-3"><label>First Name</label><input type="text" name="firstName" class="form-control"></div>
                                <div class="col-md-6 mb-3"><label>Last Name</label><input type="text" name="lastName" class="form-control"></div>
                            </div>
                            <div class="mb-3"><label>Email address</label><input type="email" name="email" class="form-control"></div>
                            <div class="mb-4"><label>Password</label><input type="password" name="password" class="form-control"></div>
                            <button type="submit" class="btn btn-info w-100 btn-anim text-dark">Sign Up</button>
                            <div class="text-center mt-3">Already have an account? <a href="/login" class="text-info">Login here</a></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>

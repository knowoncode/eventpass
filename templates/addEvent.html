{% extends "adminLayout.html" %}
{% block content %}
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}


.card{
    background:#1e293b;
    padding:35px;
    border-radius:18px;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

h1{
    text-align:center;
    margin-bottom:10px;
    font-size:30px;
    color:aliceblue;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:35px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:#cbd5e1;
    font-weight:500;
}

input,
select{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #334155;
    background:#0f172a;
    color:#fff;
    font-size:15px;
    outline:none;
    transition:.3s;
}

input:focus,
select:focus{
    border-color:#3b82f6;
    box-shadow:0 0 10px rgba(59,130,246,.4);
}

input::placeholder{
    color:#64748b;
}

.actions{
    margin-top:30px;
    display:flex;
    justify-content:flex-end;
    gap:15px;
}

button{
    padding:13px 28px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
}

.reset-btn{
    background:#475569;
    color:white;
}

.reset-btn:hover{
    background:#64748b;
}

.generate-btn{
    background:#2563eb;
    color:white;
}

.generate-btn:hover{
    background:#1d4ed8;
}

@media(max-width:768px){

.form-grid{
    grid-template-columns:1fr;
}

}
</style>



<div class="container">
<div class="card">

<h1>🎟 Add New Event</h1>
<p class="subtitle">Fill in the event details below.</p>
                        {% with message = get_flashed_messages() %}
                        {% if message %}
                        {% for msg in message %}
                        <div class="alert alert-danger" role="alert">
                            {{msg}}
                        </div>
                        {% endfor %}
                        {% endif %}
                        {% endwith %}

<form action="/addEvent" method="post">

<div class="form-grid">

<div class="full">
<label>Event Name</label>
<input name="eventName" type="text" placeholder="Enter Event Name">
</div>

<div>
<label>Start Date</label>
<input name="startDate" type="date">
</div>

<div>
<label>End Date</label>
<input name="endDate" type="date">
</div>

<div class="full">
<label>Venue</label>
<input name="venue" type="text" placeholder="Enter Venue">
</div>

<div>
<label>Total Capacity</label>
<input name="capacity" type="number" placeholder="Enter Capacity">
</div>

<div>
<label>Pass Type</label>
<select name="type">
<option selected disabled>Select Pass Type</option>
<option>General</option>
<option>VIP</option>
<option>Premium</option>
<option>Student</option>
<option>Guest</option>
</select>
</div>

</div>

<div class="actions">
<button type="reset" class="reset-btn">Reset</button>
<button type="submit" class="generate-btn">Add Event</button>
</div>

</form>

</div>
</div>


{% endblock %}
